{% macro icon(name, extra_class='') -%}
<svg class="icon {{ extra_class }}" viewBox="0 0 24 24" width="18" height="18" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">
  {%- if name == 'user' -%}
    <circle cx="12" cy="8" r="3.2"/><path d="M5 20c.7-3.5 3.2-5.4 7-5.4s6.3 1.9 7 5.4"/>
  {%- elif name == 'mail' -%}
    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>
  {%- elif name == 'lock' -%}
    <rect x="4.5" y="10" width="15" height="10" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/><path d="M12 14v2.5"/>
  {%- elif name == 'eye' -%}
    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/>
  {%- elif name == 'eye-off' -%}
    <path d="m3 3 18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.6"/><path d="M6.4 6.5A17.2 17.2 0 0 0 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.8"/>
  {%- elif name == 'shield' -%}
    <path d="M12 3 5 6v5.5c0 4.5 3 7.7 7 9.5 4-1.8 7-5 7-9.5V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == 'key' -%}
    <circle cx="8" cy="15" r="3.5"/><path d="m10.5 12.5 7-7"/><path d="m14.5 8.5 2 2"/><path d="m16.5 6.5 2 2"/>
  {%- elif name == 'db' -%}
    <ellipse cx="12" cy="5.5" rx="7" ry="3"/><path d="M5 5.5v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/><path d="M5 11.5v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
  {%- elif name == 'terminal' -%}
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M13 15h4"/>
  {%- elif name == 'logout' -%}
    <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><path d="m15 8 4 4-4 4"/><path d="M19 12H9"/>
  {%- elif name == 'arrow' -%}
    <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
  {%- elif name == 'check' -%}
    <path d="m5 12 4 4L19 6"/>
  {%- elif name == 'alert' -%}
    <path d="M12 4 3 20h18L12 4Z"/><path d="M12 9v5"/><path d="M12 17h.01"/>
  {%- elif name == 'grid' -%}
    <rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>
  {%- endif -%}
</svg>
{%- endmacro %}
