<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Secure DocVault — захищений корпоративний документообіг. Етап 5: AES-256-GCM шифрування файлів у стані спокою.">
  <title>{% block title %}Secure DocVault{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="page-glow" aria-hidden="true"></div>
  <div class="grid-noise" aria-hidden="true"></div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack" role="status" aria-live="polite">
        {% for category, message in messages %}
          <div class="flash flash--{{ category }}">
            <span class="flash__mark" aria-hidden="true"></span>
            <span class="flash__text">{{ message }}</span>
            <button class="flash__close" type="button" aria-label="Закрити повідомлення">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
